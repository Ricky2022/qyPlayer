[package]
name = "qy-desktop-common"
version = "0.6.1"
description = "两个桌面程序共用的 Tauri 命令"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
tauri = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_System_Com_Urlmon", "Win32_UI_WindowsAndMessaging"] }
